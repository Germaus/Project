<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task manager app</title>
<link rel="stylesheet" href="./styles/index.css">

</head>
<body>
<div class="header-box">
<div class="header">

<div class="header-top">
<h1>To do list</h1>
<img class="./images/upload-icon"
src="upload-3-xxl.png">
</div>

<div class="search-box">
<img class="search-icon" src="OIP.webp">
<input type="text" placeholder="Search tasks...">
  
</div>
  
</div>
  
</div>
  
<div class="task-list">
<div class="today-line">
<h2>Today</h2>
<button class="delete-all">
Delete all
<img class="delete-icon" src="OIP3.webp">
</button>
</div>
  
<div class="tasks">
<input class="task1" type="text" placeholder="&#9711; Task 1">
<input class="task2" type="text" placeholder="&#9711; Task 2">
  
<div class="task3-box">
<span class="circle">&#10003;</span>
<span class="task3">Task 3</span>
</div>
  
<input class="task4" type="text" placeholder="&#9711; Task 4">
</div>
  
<div>
<button class="add-new-task-button">
Add New Task
</button>
</div>
</div>



</body>
</html>
